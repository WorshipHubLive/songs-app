# Basic smoke test — the app launches and its three NativeTabs (Songs,
# Service, Settings) are all reachable. Run with:
#   maestro test .maestro/smoke-test.yaml
appId: com.fercho34.songs-app
---
- launchApp
- assertVisible: "Songs"
- assertVisible: "Search songs..."

- tapOn: "Service"
- assertVisible: "Service"

- tapOn: "Settings"
- assertVisible: "Settings"

- tapOn: "Songs"
- assertVisible: "Search songs..."
