# Basic smoke test — the app launches and its three NativeTabs (Songs,
# Service, Settings) are all reachable. Run with:
#   maestro test .maestro/smoke-test.yaml
#
# Assertions are in Spanish because the app is now fully localized (see
# i18n/) and this flow runs against a simulator whose device locale is
# Spanish — i18next correctly resolves to the `es` resource there, not
# the `en` fallback. Update these strings (or add a locale override) if
# you run this against a differently-localized simulator.
#
# appId defaults to the iOS bundle identifier — Android's package name
# (com.fercho34.songsapp, see app.json) is different, so an Android run
# needs an override:
#   maestro test -e MAESTRO_APP_ID=com.fercho34.songsapp .maestro/smoke-test.yaml
appId: ${MAESTRO_APP_ID}
env:
  MAESTRO_APP_ID: live.worshiphub.songs
---
- launchApp
# expo-dev-client shows either a one-time "Dev Tools" tutorial or the
# dev menu itself on a fresh launch here — both are dismissed the same
# way (their shared "✕" close button, top-right of the sheet).
# `optional: true` skips the step without failing once neither appears.
- tapOn:
    point: "68%,36%"
    optional: true
- assertVisible: "Canciones"
- assertVisible: "Buscar canciones..."

- tapOn: "Servicio"
- assertVisible: "Servicio"

- tapOn: "Ajustes"
- assertVisible: "Ajustes"

- tapOn: "Canciones"
- assertVisible: "Buscar canciones..."
