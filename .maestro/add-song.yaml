# Creates a song end-to-end through the real UI and confirms the save
# actually went through. Run with:
#   maestro test .maestro/add-song.yaml
#
# Assertions are in Spanish — see smoke-test.yaml's header comment.
appId: com.fercho34.songs-app
---
- launchApp
- tapOn: "Añadir"
- assertVisible: "Atrás"

- tapOn: "Título de la canción"
- inputText: "Maestro Flow Test Song"
- tapOn: "Artista"
- inputText: "Maestro"

- tapOn: "Guardar"

# Asserting on the exact typed text back in the list is flaky here —
# Maestro's synthetic typing on a React Native controlled TextInput can
# drop a stray keystroke, which reads as a false failure unrelated to
# any real app bug. handleSave() only calls router.back() on a
# successful save (an empty/failed title shows an Alert instead and
# stays on this screen) — being back on the Songs list is itself proof
# the save went through.
- assertVisible: "Buscar canciones..."
